<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebApp Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h3>🔧 Тест WebApp</h3>
    <button onclick="sendTest()">Отправить тест</button>
    <div id="status"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // При загрузке сразу отправляем init
        tg.sendData(JSON.stringify({action: 'init'}));
        document.getElementById('status').innerText = 'Init отправлен';

        function sendTest() {
            tg.sendData(JSON.stringify({action: 'test', message: 'Hello'}));
            document.getElementById('status').innerText = 'Тест отправлен';
        }

        // Показываем ответы от бота
        tg.onEvent('message', function(event) {
            alert('Ответ от бота: ' + event.data);
            document.getElementById('status').innerText = 'Ответ: ' + event.data;
        });
    </script>
</body>
</html>
