<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebApp Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h3>Тест WebApp</h3>
    <button onclick="sendTest()">Отправить тест</button>
    <button onclick="requestPhone()">Поделиться номером</button>
    <div id="status"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendTest() {
            tg.sendData(JSON.stringify({action: 'test', message: 'Hello from WebApp'}));
            document.getElementById('status').innerText = 'Тест отправлен';
        }

        function requestPhone() {
            tg.requestContact((success, response) => {
                if (success && response?.responseUnsafe?.contact?.phone_number) {
                    let phone = response.responseUnsafe.contact.phone_number;
                    tg.sendData(JSON.stringify({action: 'send_phone', phone: phone}));
                    document.getElementById('status').innerText = 'Номер отправлен';
                } else {
                    document.getElementById('status').innerText = 'Не удалось получить номер';
                }
            });
        }
    </script>
</body>
</html>
